<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="EcoVolt shared tool inventory, QR movement tracking, and equipment loans." />
  <title>EcoVolt Inventory</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('ecovolt-inventory-theme');
      const theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.inventoryTheme = theme;
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#111311' : '#f2efe9');
    } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/convex@1.17.4/dist/browser.bundle.js"></script>
  <script>
    window.CONFIG = window.CONFIG || {
      CONVEX_URL: "https://wonderful-kookabura-432.convex.cloud",
    };
  </script>
</head>
<body>
  <div id="inventory-root"></div>
  <script type="module" src="/src/inventory/index.tsx"></script>
</body>
</html>
